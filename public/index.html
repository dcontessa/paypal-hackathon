<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Runway: AI cash-flow copilot</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div>
      <h1>Runway</h1>
      <p id="merchant" class="muted"></p>
    </div>
    <div id="modes" class="modes"></div>
  </header>

  <main>
    <section class="card wide">
      <div class="card-head">
        <h2>30-day cash forecast</h2>
        <p id="forecast-note" class="muted"></p>
      </div>
      <div id="chart"></div>
      <div class="legend">
        <span><i class="dot base"></i>If nothing changes</span>
        <span><i class="dot agent"></i>If reminders land</span>
      </div>
    </section>

    <section class="card">
      <h2>Receivables</h2>
      <table id="invoices"></table>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Runway agent</h2>
        <button id="run" class="primary">Review my receivables</button>
      </div>
      <ol id="trace" class="trace"><li class="muted">The agent proposes. You approve. Nothing is sent without you.</li></ol>
      <div id="proposals"></div>
    </section>

    <section class="card wide">
      <h2>Audit log</h2>
      <ul id="log" class="log"></ul>
    </section>
  </main>

  <script src="app.js" type="module"></script>
</body>
</html>
